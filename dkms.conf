PACKAGE_NAME="dacberry400"
PACKAGE_VERSION="3.1.1"

MAKE[0]="make -C src KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C src KDIR=/lib/modules/${kernelver}/build clean"

BUILT_MODULE_NAME[0]="snd-soc-dacberry400"
BUILT_MODULE_LOCATION[0]="src/"
# updates/ is searched before kernel/, so this overrides the in-tree module
DEST_MODULE_LOCATION[0]="/updates"

AUTOINSTALL="yes"
